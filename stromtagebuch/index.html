<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b57">
<link rel="manifest" href="./manifest.webmanifest">
<title>Stromtagebuch</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b6b57;color:#fff}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
.card{max-width:420px}.bolt{font-size:46px}.title{font-size:25px;font-weight:900;margin:10px 0 6px}.hint{opacity:.88;line-height:1.45}
button{margin-top:18px;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;background:#fff;color:#0b6b57}
</style>
</head>
<body>
<main><div class="card"><div class="bolt">⚡</div><div class="title">Stromtagebuch wird gestartet</div><div class="hint" id="status">Alten App-Cache bereinigen …</div><button id="open" hidden>App öffnen</button></div></main>
<script>
(function(){
 var status=document.getElementById("status"),btn=document.getElementById("open");
 function target(){
   var p=new URLSearchParams(location.search),view=p.get("view"),q="?v=147";
   if(view)q+="&view="+encodeURIComponent(view);
   return "./app.html"+q;
 }
 function go(){location.replace(target())}
 btn.onclick=go;
 Promise.all([
   ("serviceWorker" in navigator?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}):Promise.resolve()),
   ("caches" in window?caches.keys().then(function(keys){return Promise.all(keys.filter(function(k){return k.indexOf("stromtagebuch-")===0}).map(function(k){return caches.delete(k)}))}):Promise.resolve())
 ]).then(function(){
   status.textContent="Bereit – App wird geöffnet …";
   setTimeout(go,150);
 }).catch(function(){
   status.textContent="App bereit. Bitte einmal öffnen.";
   btn.hidden=false;
 });
 setTimeout(function(){btn.hidden=false;status.textContent="Falls die App nicht automatisch startet, hier tippen.";},3000);
})();
</script>
</body>
</html>
