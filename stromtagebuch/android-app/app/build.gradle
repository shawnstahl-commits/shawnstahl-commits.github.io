plugins {
    id "com.android.application"
}

android {
    namespace "de.stromtagebuch.app"
    compileSdk 35

    defaultConfig {
        applicationId "de.stromtagebuch.app"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
