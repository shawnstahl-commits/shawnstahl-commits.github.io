<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BonKlar Browser-Test</title>
<style>
body{font-family:system-ui;margin:0;padding:24px;background:#f6f7fb;color:#0f172a}
.card{max-width:520px;margin:20px auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800;background:#16a34a;color:#fff;margin-top:12px}
#result{margin-top:16px;padding:14px;border-radius:12px;background:#f1f5f9;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>BonKlar Browser-Test</h1>
<p>Diese Seite hat keinen Scanner, keine OCR und keine externen Bibliotheken.</p>
<button onclick="document.getElementById('result').textContent='✅ BUTTON FUNKTIONIERT';document.getElementById('result').style.background='#dcfce7'">1. Button testen</button>
<button onclick="try{localStorage.setItem('bonklar_test','ja');document.getElementById('result').textContent='✅ SPEICHERN FUNKTIONIERT';document.getElementById('result').style.background='#dcfce7'}catch(e){document.getElementById('result').textContent='❌ SPEICHERN BLOCKIERT: '+e.name;document.getElementById('result').style.background='#fee2e2'}">2. Speichern testen</button>
<div id="result">Noch nichts getestet.</div>
</div>
</body>
</html>
