name: Build Stromtagebuch Android

on:
  workflow_dispatch:
  push:
    paths:
      - "stromtagebuch/android-app/**"
      - ".github/workflows/stromtagebuch-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$SDKMANAGER" "platforms;android-35"
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            "$SDKMANAGER" "build-tools;35.0.0"
          fi

      - name: Build debug APK
        working-directory: stromtagebuch/android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp stromtagebuch/android-app/app/build/outputs/apk/debug/app-debug.apk stromtagebuch/android-app/Stromtagebuch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stromtagebuch-Android-APK
          path: stromtagebuch/android-app/Stromtagebuch.apk
          if-no-files-found: error
          retention-days: 30
