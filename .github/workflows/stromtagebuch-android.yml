name: Build Stromtagebuch Android

on:
  workflow_dispatch:
  push:
    paths:
      - "stromtagebuch/android-app/**"
      - ".github/workflows/stromtagebuch-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: stromtagebuch/android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp stromtagebuch/android-app/app/build/outputs/apk/debug/app-debug.apk stromtagebuch/android-app/Stromtagebuch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stromtagebuch-Android-APK
          path: stromtagebuch/android-app/Stromtagebuch.apk
          if-no-files-found: error
          retention-days: 30
