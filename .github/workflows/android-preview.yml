name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "staging/**"
      - "android-preview/**"
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate and configure Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor
        working-directory: android-preview
        run: npm install --no-audit --no-fund

      - name: Prepare bundled web app
        run: |
          rm -rf android-preview/www
          mkdir -p android-preview/www
          cp staging/index.html android-preview/www/index.html
          cp staging/manifest.webmanifest android-preview/www/manifest.webmanifest
          cp staging/icon.svg android-preview/www/icon.svg
          cp staging/sw.js android-preview/www/sw.js

      - name: Add Android platform
        working-directory: android-preview
        run: npx cap add android

      - name: Set native scanner minimum Android SDK
        working-directory: android-preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/variables.gradle")
          s=p.read_text()
          s=s.replace("minSdkVersion = 24","minSdkVersion = 26")
          s=s.replace("minSdkVersion = 23","minSdkVersion = 26")
          p.write_text(s)
          assert "minSdkVersion = 26" in s
          PY

      - name: Add Android camera permission
        working-directory: android-preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )
          p.write_text(s)
          PY

      - name: Generate Android icon and splash
        working-directory: android-preview
        run: |
          mkdir -p assets
          cp ../icon.svg assets/logo.svg
          npx @capacitor/assets generate --android \
            --assetPath assets \
            --iconBackgroundColor "#0f766e" \
            --splashBackgroundColor "#f5f8f7"

      - name: Sync Capacitor
        working-directory: android-preview
        run: npx cap sync android

      - name: Validate bundled JavaScript
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("android-preview/www/index.html","utf8");
          const re=new RegExp("<script(?:\\\\s[^>]*)?>([\\\\s\\\\S]*?)</script>","gi");
          const scripts=[]; let m;
          while((m=re.exec(html))!==null){ if(m[1].trim()) scripts.push(m[1]); }
          for(const s of scripts) new Function(s);
          if(!html.includes("7.4.1 RC Staging")) throw new Error("Unexpected app version");
          if(/sb_secret_/i.test(html)) throw new Error("Secret Supabase key found in web bundle");
          console.log("Bundled JS and version check OK");
          NODE

      - name: Build debug APK
        working-directory: android-preview/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-preview/android/app/build/outputs/apk/debug/app-debug.apk E-Check-Kids-preview.apk

      - name: Verify Android APK
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose E-Check-Kids-preview.apk
          BADGING="$("$AAPT" dump badging E-Check-Kids-preview.apk)"
          PERMS="$("$AAPT" dump permissions E-Check-Kids-preview.apk)"
          echo "$BADGING"
          echo "$PERMS"
          echo "$BADGING" | grep -F "package: name='de.echeckkids.preview'"
          echo "$BADGING" | grep -F "sdkVersion:'26'"
          echo "$BADGING" | grep -F "application-label:'E-Check Kids'"
          echo "$PERMS" | grep -F "android.permission.CAMERA"
          echo "$PERMS" | grep -F "android.permission.INTERNET"
          unzip -l E-Check-Kids-preview.apk | grep -F "assets/public/index.html"
          unzip -l E-Check-Kids-preview.apk | grep -F "assets/public/manifest.webmanifest"
          unzip -l E-Check-Kids-preview.apk | grep -F "assets/public/icon.svg"
          test "$(stat -c%s E-Check-Kids-preview.apk)" -gt 1000000
          sha256sum E-Check-Kids-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Check-Kids-Android-Preview
          path: E-Check-Kids-preview.apk
          if-no-files-found: error
          retention-days: 14
