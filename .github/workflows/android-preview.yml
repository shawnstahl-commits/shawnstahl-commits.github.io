name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "staging/**"
      - "android-preview/**"
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor
        working-directory: android-preview
        run: npm install --no-audit --no-fund

      - name: Prepare bundled web app
        run: |
          rm -rf android-preview/www
          mkdir -p android-preview/www
          cp staging/index.html android-preview/www/index.html
          cp staging/manifest.webmanifest android-preview/www/manifest.webmanifest
          cp staging/icon.svg android-preview/www/icon.svg
          cp staging/sw.js android-preview/www/sw.js

      - name: Add Android platform
        working-directory: android-preview
        run: npx cap add android

      - name: Add Android camera permission
        working-directory: android-preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )
          p.write_text(s)
          PY

      - name: Generate Android icon and splash
        working-directory: android-preview
        run: |
          mkdir -p assets
          cp ../icon.svg assets/logo.svg
          npx @capacitor/assets generate --android \
            --assetPath assets \
            --iconBackgroundColor "#0f766e" \
            --splashBackgroundColor "#f5f8f7"

      - name: Sync Capacitor
        working-directory: android-preview
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-preview/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-preview/android/app/build/outputs/apk/debug/app-debug.apk E-Check-Kids-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Check-Kids-Android-Preview
          path: E-Check-Kids-preview.apk
          if-no-files-found: error
          retention-days: 14
