name: Deploy ROMDex to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "romdex/**"
      - ".github/workflows/romdex-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "romdex-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload ROMDex
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./romdex"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
